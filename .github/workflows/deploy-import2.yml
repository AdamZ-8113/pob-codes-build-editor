name: Build Editor Release Artifact
run-name: Build editor artifact ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full reviewed public main commit SHA
        required: true
        type: string

# This repository never receives Cloudflare credentials or deploys production.
permissions:
  contents: read
  actions: read

concurrency:
  group: build-editor-artifacts
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - name: Validate exact public-main SHA
        env:
          TARGET: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$TARGET" = "$WORKFLOW_SHA"
          test "$TARGET" = "$(git rev-parse HEAD)"
          test "$(git rev-parse "$TARGET")" = "$TARGET"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$TARGET" origin/main
      - name: Require successful push CI for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.commit_sha }}
        run: node scripts/release/verify-ci-eligibility.mjs --sha="$TARGET"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.12
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run check && npm run test:unit && npm run test:native && npm run pack
      - name: Materialize one standalone candidate generation
        env:
          GITHUB_SHA: ${{ inputs.commit_sha }}
        run: node scripts/release/materialize-import2.mjs && node scripts/release/create-release-record.mjs && node scripts/release/archive-release.mjs
      - run: npm run verify:release
      - name: Verify the materialized editor in a headless browser
        run: npx playwright install --with-deps chromium && npm run test:e2e:release
      - name: Publish candidate bytes for independent deployment verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-editor-${{ inputs.commit_sha }}
          path: |
            .runtime/release-assets/*.tar.gz
            .runtime/release-inventory.json
            .runtime/release-record.json
          if-no-files-found: error
          retention-days: 7
