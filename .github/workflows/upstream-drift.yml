name: Upstream overlay drift
run-name: Upstream overlay drift (${{ inputs.ref || 'dev' }})

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Public upstream ref or SHA (historical probes are advisory)
        type: string
        default: dev
        required: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Collect public tree evidence
        env:
          TARGET_REF: ${{ inputs.ref || 'dev' }}
        run: node scripts/build/upstream-drift.mjs --ref "$TARGET_REF" --output "$RUNNER_TEMP/report.json"
      - name: Retain bounded data report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-drift-report
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
          retention-days: 30
