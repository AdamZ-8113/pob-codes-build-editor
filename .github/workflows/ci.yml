name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.12
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run check
      - run: npm run test:unit

  native-and-browser:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.12
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run test:native
      - run: npm run pack
      - run: node scripts/release/materialize-import2.mjs
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run test:e2e:release
      - name: Run development browser harnesses (shadow)
        id: browser-harnesses
        continue-on-error: true
        env:
          BUILD_EDITOR_BROWSER_CHANNEL: ""
        run: npm run test:browser
      - name: Retain public-fixture browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-browser-failure-${{ github.sha }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
