name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.12
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run check
      - run: npm run test:unit

  native-and-browser:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.12
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run test:native
      - run: npm run pack
      - name: Build and bind the canonical release candidate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/release/materialize-import2.mjs && node scripts/release/create-release-record.mjs && node scripts/release/archive-release.mjs
      - name: Verify candidate tree and archive before browser acceptance
        run: npm run verify:release
      - run: npx playwright install --with-deps chromium
      - name: Exercise the exact candidate tree in a headless browser
        id: release-browser
        run: npm run test:e2e:release
      - name: Summarize release-browser attempts and phase budgets
        if: always()
        run: node scripts/release/summarize-release-browser.mjs
      - name: Retain bounded public-fixture browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-browser-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/release-phase-timings.json
            test-results/release-browser-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Reverify that browser acceptance did not mutate candidate bytes
        if: steps.release-browser.outcome == 'success'
        run: npm run verify:release
      - name: Publish the successful push/main CI candidate
        id: ci-candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release-browser.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/release-assets/*.tar.gz
            .runtime/release-inventory.json
            .runtime/release-record.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record CI candidate provenance
        if: steps.ci-candidate.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.ci-candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.ci-candidate.outputs.artifact-digest }}
        run: |
          echo "### Canonical release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: CI run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: $ARTIFACT_ID ($ARTIFACT_DIGEST)" >> "$GITHUB_STEP_SUMMARY"

  browser-harnesses:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.12
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run test:native
      - run: npm run pack
      - run: npx playwright install --with-deps chromium
      - name: Run development browser harnesses
        id: browser-harnesses
        env:
          BUILD_EDITOR_BROWSER_CHANNEL: ""
        run: npm run test:browser
      - name: Report development browser harness outcome
        if: always()
        env:
          HARNESS_OUTCOME: ${{ steps.browser-harnesses.outcome }}
        run: |
          echo "Development browser harnesses: $HARNESS_OUTCOME"
          echo "Development browser harnesses: $HARNESS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
